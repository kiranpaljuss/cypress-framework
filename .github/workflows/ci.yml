name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly run to catch drift in the third-party demo applications under test.
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-checks:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: 0

      - name: Lint (ESLint + gherkin-lint)
        run: yarn lint

      - name: Type-check
        run: yarn typecheck

  e2e:
    name: Cypress tests
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      # A single Cypress process keeps CI deterministic; the suite is small enough that
      # parallelism saves little here. Use `yarn test:parallel` locally for larger runs.
      - name: Run Cypress tests
        uses: cypress-io/github-action@v7
        with:
          command: yarn test

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cucumber-report
          path: report/
          if-no-files-found: warn

      - name: Upload failure screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: cypress/screenshots/
          if-no-files-found: ignore

  publish-report:
    name: Publish report to GitHub Pages
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cucumber-report
          path: report

      - name: Prepare site
        run: |
          mkdir -p _site
          cp report/HTML/cucumber_report.html _site/index.html

      # Name the artifact per attempt so "Re-run jobs" doesn't find duplicates.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

      - id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
